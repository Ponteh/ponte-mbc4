name: Windows VST3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DMC2000_BUILD_TESTS=ON -DMC2000_BUILD_RESEARCH=OFF

      - name: Build tests and VST3
        run: cmake --build build --config Release --target MC2000Tests MC2000UITests MC2000NapValidation PonteMC2000_VST3

      - name: Test
        run: |
          ctest --test-dir build -C Release --output-on-failure --no-tests=error --output-junit "$pwd/build/test-results.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cases = @(Select-Xml -Path build/test-results.xml -XPath '//testcase')
          if ($cases.Count -lt 4) { throw 'Expected DSP, UI, RealtimeMatrix and Nap validation' }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Ponte-MBC4-Windows-VST3
          path: build/PonteMC2000_artefacts/Release/VST3/Ponte MBC4.vst3
          if-no-files-found: error

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ponte-MBC4-test-diagnostics
          path: |
            build/Testing/Temporary/LastTest.log
            build/test-results.xml
            build/technical-matrix.json
            build/nap-validation.csv
          if-no-files-found: warn
