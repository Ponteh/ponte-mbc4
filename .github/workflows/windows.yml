name: Windows VST3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DMC2000_BUILD_TESTS=ON

      - name: Build tests and VST3
        run: cmake --build build --config Release --target MC2000Tests PonteMC2000_VST3

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Ponte-MBC4-Windows-VST3
          path: build/PonteMC2000_artefacts/Release/VST3/Ponte MBC4.vst3
          if-no-files-found: error
